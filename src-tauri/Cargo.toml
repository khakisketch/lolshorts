[package]
name = "lolshorts"
version = "1.2.0"
description = "League of Legends auto-recording and editing desktop app with YouTube integration"
authors = ["LoLShorts Team"]
license = "MIT"
repository = "https://github.com/lolshorts/lolshorts"
edition = "2021"

[lib]
name = "lolshorts"
path = "src/lib.rs"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Async Runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP Client & WebSocket
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
warp = "0.3"

# OAuth2 for YouTube authentication
oauth2 = "4.4"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Crash Reporting
sentry = "0.34"

# Async support
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"


# Utilities
once_cell = "1.20"
dirs = "5.0"
dotenvy = "0.15"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
fastrand = "2.0"

# Video Recording Strategy:
# - Windows: FFmpeg CLI with gdigrab (screen capture) + H.265 hardware encoding (NVENC/QSV/AMF)
# - Segment-based circular buffer (6 x 10s = 60s replay window)
# - Process-based approach for stability, simplicity, and field-testable reliability
# - FFmpeg binary bundled with application installer
# - No alternative encoders needed for production (rav1e removed)
# MP4 crate for native video processing
mp4 = "0.14"

# Performance optimization
parking_lot = "0.12"

# System info
sysinfo = "0.31"
num_cpus = "1.16"
tokio-util = "0.7.17"

# Cross-platform video dependencies (optional for basic compilation)
ffmpeg-next = { version = "7.0", features = ["static"], optional = true }
base64 = "0.22.1"
urlencoding = "2.1"

# WASAPI loopback audio capture
cpal = "0.15"
hound = "3.5"

# Windows-specific
[target.'cfg(windows)'.dependencies]
wmi = "0.13"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
windows-capture = "2.0.0-alpha.7"

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
# Core frameworks
core-graphics = "0.23"
core-foundation = "0.9"
core-foundation-sys = "0.8"
core-video-sys = "0.1"

# Objective-C interop for macOS
objc2 = "0.5"
block2 = "0.5"

# Note: objc2-* crates may need to be replaced or version adjusted based on availability
# For now, using platform-specific bindings that are actually available

# Linux-specific
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = { version = "0.31", optional = true }

[dev-dependencies]
tempfile = "3.14"
wait-timeout = "0.2"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Optional FFmpeg static linking (not used in production - we bundle FFmpeg binary)
ffmpeg = ["ffmpeg-next"]


# Note: Production build profiles moved to workspace root to resolve warnings

# Benchmarks
[[bench]]
name = "auto_edit_benchmark"
harness = false
