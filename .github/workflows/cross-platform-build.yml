name: Legacy Cross-Platform Build (Manual)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows build
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          toolchain: 1.94.1
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          # Install FFmpeg for Windows
          winget install Gyan.FFmpeg
          # Install Node.js for frontend
          winget install OpenJS.NodeJS
          refreshenv

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Rust project
        working-directory: ./src-tauri
        run: cargo build --verbose --release

      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test --verbose

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: src-tauri/target/release/bundle/
          retention-days: 7

  # macOS build
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          toolchain: 1.94.1
          target: x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          # Install FFmpeg for macOS
          brew install ffmpeg
          # Install pkg-config for macOS
          brew install pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Rust project
        working-directory: ./src-tauri
        run: cargo build --verbose --release

      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test --verbose

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: src-tauri/target/release/bundle/
          retention-days: 7

  # Linux build
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          toolchain: 1.94.1
          target: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Rust project
        working-directory: ./src-tauri
        run: cargo build --verbose --release

      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test --verbose

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/
          retention-days: 7

  # Cross-platform integration tests
  integration-tests:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg pkg-config
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install ffmpeg pkg-config
          elif [ "$RUNNER_OS" == "Windows" ]; then
            winget install Gyan.FFmpeg
          fi
        shell: bash

      - name: Run integration tests
        working-directory: ./src-tauri
        run: cargo test --test '*' --verbose

      - name: Test platform detection
        working-directory: ./src-tauri
        run: |
          cargo run --bin test_platform_detection || echo "Platform detection test skipped"

  # Performance benchmarks
  benchmarks:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config

      - name: Run benchmarks
        working-directory: ./src-tauri
        run: cargo bench --all

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: src-tauri/target/criterion/
          retention-days: 30

  # Security audit
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run security audit
        run: cargo audit --file Cargo.lock

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny
        working-directory: ./src-tauri
        run: cargo deny check
