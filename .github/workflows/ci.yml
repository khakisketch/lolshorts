name: CI - Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Backend tests (Rust)
  backend-test:
    name: Backend Tests (Rust)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Prepare compile-only FFmpeg resource fixtures
        shell: powershell
        run: |
          # Cargo/Tauri validates externalBin paths while compiling tests, but
          # this job never bundles or executes the media tools. Keep the large,
          # checksum-pinned download in the installer/E2E jobs below.
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          New-Item -ItemType File -Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType File -Path src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Set-Content -LiteralPath dist/index.html -Value '<!doctype html><html><body>compile-only fixture</body></html>' -NoNewline

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration

  # Frontend tests (React/TypeScript)
  frontend-test:
    name: Frontend Tests (React)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run frontend tests with coverage
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":50}}'

      - name: Build frontend
        run: npm run build

      - name: Check bundle size
        run: |
          $bundleSize = (Get-Item dist/assets/*.js | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Bundle size: $([math]::Round($bundleSize, 2)) MB"
          if ($bundleSize -gt 5) {
            Write-Error "Bundle size exceeds 5 MB limit"
            exit 1
          }

  # E2E tests with Playwright
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: windows-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Tauri
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare pinned FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Build application
        run: npm run tauri build -- --debug
        env:
          # Tauri runs Cargo from src-tauri, so this resolves to
          # src-tauri/target rather than src-tauri/src-tauri/target.
          CARGO_TARGET_DIR: target

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run Rust security audit
        run: cargo audit --file Cargo.lock

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Run npm security audit
        run: npm audit --omit=dev --audit-level=moderate

  # Build check (verify full build works)
  build-check:
    name: Build Check
    runs-on: windows-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Tauri
        run: npm run build

      - name: Prepare pinned FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Generate ephemeral updater signing fixture
        id: fixture-key
        shell: powershell
        run: |
          # CI validates that installers can be produced without depending on
          # production signing secrets. The release workflow is the only job
          # allowed to consume the real private key.
          $keyPath = Join-Path $env:RUNNER_TEMP "lolshorts-ci.key"
          npx tauri signer generate --ci --password "ci-fixture-only" --write-keys $keyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "private_key_path=$keyPath" >> $env:GITHUB_OUTPUT
          "public_key_path=$keyPath.pub" >> $env:GITHUB_OUTPUT

      - name: Build application (release mode)
        # Use the pinned project-local CLI from package-lock.json. A runner's
        # global cargo-tauri installation is not part of our reproducible toolchain.
        shell: powershell
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath '${{ steps.fixture-key.outputs.private_key_path }}' -Raw
          $env:TAURI_UPDATER_PUBKEY = Get-Content -LiteralPath '${{ steps.fixture-key.outputs.public_key_path }}' -Raw
          npm run tauri build -- --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ci-fixture-only

      - name: Verify installers created
        run: |
          $msiExists = Test-Path "src-tauri/target/release/bundle/msi/*.msi"
          $nsisExists = Test-Path "src-tauri/target/release/bundle/nsis/*-setup.exe"

          if (-not $msiExists) {
            Write-Error "MSI installer not found"
            exit 1
          }

          if (-not $nsisExists) {
            Write-Error "NSIS installer not found"
            exit 1
          }

          Write-Host "✅ All installers created successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7

  # All checks passed
  all-checks-passed:
    name: All Checks Passed
    runs-on: windows-latest
    needs: [backend-test, frontend-test, e2e-test, security-audit, build-check]
    if: success()

    steps:
      - name: All checks passed
        run: |
          Write-Host "✅ All CI checks passed successfully!" -ForegroundColor Green
          Write-Host "Ready for deployment or release." -ForegroundColor Green
