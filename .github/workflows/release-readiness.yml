name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit makes all evidence from an older commit obsolete. Cancelling
# it conserves Windows runners without mixing artifacts across revisions.
concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# These are intentionally public, fixture-only values. Release secrets belong
# exclusively in release.yml's protected production environment.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VITE_SUPABASE_URL: https://fixture.supabase.co
  VITE_SUPABASE_ANON_KEY: release-readiness-public-anon-fixture
  SUPABASE_URL: https://fixture.supabase.co
  SUPABASE_ANON_KEY: release-readiness-public-anon-fixture
  YOUTUBE_CLIENT_ID: release-readiness.apps.googleusercontent.com
  YOUTUBE_CLIENT_SECRET: release-readiness-public-desktop-fixture
  YOUTUBE_REDIRECT_URI: http://127.0.0.1:9090/oauth/callback
  # Intentionally omitted: Sentry is optional and must not block this gate.

jobs:
  frontend-unit-build:
    name: Frontend unit, lint, typecheck, and production build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          npm run verify:frontend *>&1 | Tee-Object -FilePath readiness-logs/frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-frontend-${{ github.sha }}
          path: readiness-logs/
          if-no-files-found: ignore
          retention-days: 7

  rust-tests-security:
    name: Rust format, lint, tests, and dependency audit
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo inputs and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.94.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-rust-1.94.1-

      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Prepare FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Verify Rust and dependency security
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          $steps = @(
            @{ Name = "rust-fmt"; Command = { cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check } },
            @{ Name = "rust-clippy"; Command = { cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings } },
            @{ Name = "rust-tests"; Command = { cargo test --manifest-path src-tauri/Cargo.toml } },
            @{ Name = "rust-audit"; Command = { cargo audit --file Cargo.lock } }
          )
          foreach ($step in $steps) {
            & $step.Command *>&1 | Tee-Object -FilePath "readiness-logs/$($step.Name).log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-rust-${{ github.sha }}
          path: readiness-logs/
          if-no-files-found: ignore
          retention-days: 7

  media-release-contract:
    name: FFmpeg media, release contract, and field tooling
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Verify media, release, and field contracts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          $steps = @(
            @{ Name = "media-regression"; Command = { ./scripts/verify-media-regression.ps1 } },
            @{ Name = "release-contract"; Command = { ./scripts/verify-release-contract.ps1 } },
            @{ Name = "field-evidence-tools"; Command = { npm run test:field-tools } },
            @{ Name = "npm-production-audit"; Command = { npm audit --omit=dev --audit-level=high } },
            @{ Name = "whitespace"; Command = { git diff --check } }
          )
          foreach ($step in $steps) {
            & $step.Command *>&1 | Tee-Object -FilePath "readiness-logs/$($step.Name).log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload media and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-media-release-${{ github.sha }}
          path: readiness-logs/
          if-no-files-found: ignore
          retention-days: 7

  supabase-contract-tests:
    name: Supabase static contract and quota logic
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase static contract and quota logic
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          npm run verify:supabase-contract *>&1 | Tee-Object -FilePath readiness-logs/supabase-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:supabase *>&1 | Tee-Object -FilePath readiness-logs/supabase.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Supabase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-supabase-${{ github.sha }}
          path: readiness-logs/
          if-no-files-found: ignore
          retention-days: 7

  supabase-database-tests:
    name: Supabase migration, RLS, and quota database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.101.0

      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p readiness-logs
          supabase start 2>&1 | tee readiness-logs/supabase-start.log

      - name: Rebuild migrations and run pgTAP
        shell: bash
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee readiness-logs/supabase-db-reset.log
          supabase test db 2>&1 | tee readiness-logs/supabase-db-tests.log

      - name: Stop isolated Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup 2>&1 | tee readiness-logs/supabase-stop.log

      - name: Upload Supabase database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-supabase-db-${{ github.sha }}
          path: readiness-logs/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    name: Browser E2E diagnostics
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox msedge

      - name: Run Playwright diagnostics
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          npm run test:e2e *>&1 | Tee-Object -FilePath readiness-logs/playwright.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Playwright logs and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-browser-${{ github.sha }}
          path: |
            readiness-logs/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer-fixtures:
    name: Windows MSI and NSIS fixture lifecycle
    needs:
      - frontend-unit-build
      - rust-tests-security
      - media-release-contract
      - supabase-contract-tests
      - supabase-database-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Generate ephemeral updater fixture key
        id: fixture-key
        shell: powershell
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "lolshorts-readiness.key"
          npx tauri signer generate --ci --password "readiness-fixture-only" --write-keys $keyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "private_key_path=$keyPath" >> $env:GITHUB_OUTPUT
          "public_key_path=$keyPath.pub" >> $env:GITHUB_OUTPUT

      - name: Build MSI and NSIS updater fixtures
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: readiness-fixture-only
        run: |
          New-Item -ItemType Directory -Force readiness-logs | Out-Null
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath '${{ steps.fixture-key.outputs.private_key_path }}' -Raw
          $env:TAURI_UPDATER_PUBKEY = Get-Content -LiteralPath '${{ steps.fixture-key.outputs.public_key_path }}' -Raw
          npx tauri build --bundles msi,nsis *>&1 | Tee-Object -FilePath readiness-logs/tauri-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate fixture contract and silent install lifecycle
        shell: powershell
        run: |
          ./scripts/verify-release-contract.ps1 -BundleDir src-tauri/target/release/bundle *>&1 | Tee-Object -FilePath readiness-logs/release-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          ./tests/installer/validate-installer.ps1 -InstallerPath $msi.FullName -InstallerType MSI -NonInteractive -RunSilentInstall *>&1 | Tee-Object -FilePath readiness-logs/msi-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/installer/validate-installer.ps1 -InstallerPath $nsis.FullName -InstallerType NSIS -NonInteractive -RunSilentInstall *>&1 | Tee-Object -FilePath readiness-logs/nsis-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify updater failure-preservation fixtures
        shell: powershell
        run: |
          ./tests/installer/verify-updater-fixtures.ps1 -BundleDir src-tauri/target/release/bundle *>&1 | Tee-Object -FilePath readiness-logs/updater-fixtures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer logs and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-installers-${{ github.sha }}
          path: |
            readiness-logs/
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: ignore
          retention-days: 7
