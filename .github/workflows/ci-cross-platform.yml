name: Experimental Cross-Platform CI (Manual)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Backend tests across platforms
  backend-test:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            binary_ext: .exe
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            binary_ext: ""
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            binary_ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -k dist/assets/*.js | awk '{sum+=$1} END {print sum/1024}')
          echo "Bundle size: ${BUNDLE_SIZE} MB"
          if (( $(echo "$BUNDLE_SIZE > 5" | bc -l) )); then
            echo "Bundle size exceeds 5 MB limit"
            exit 1
          fi

      - name: Run unit tests
        run: npm test

  # E2E tests on Windows (primary platform)
  e2e-test-windows:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application (debug)
        run: npm run tauri build -- --debug

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: test-results/
          retention-days: 30

  # E2E tests on macOS (secondary platform)
  e2e-test-macos:
    name: E2E Tests (macOS)
    runs-on: macos-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application (debug)
        run: npm run tauri build -- --debug

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: test-results/
          retention-days: 30

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Run Rust security audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit --file Cargo.lock

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Run npm security audit
        run: npm ci && npm audit --omit=dev --audit-level=moderate

  # Cross-platform build verification
  build-check:
    name: Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [backend-test, frontend-test]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            platform: windows
            artifact_pattern: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            platform: macos
            artifact_pattern: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg binaries
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd src-tauri/build_scripts
            ./prepare_ffmpeg.ps1 -Source Download
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install ffmpeg
            mkdir -p src-tauri/binaries
            cp "$(which ffmpeg)" src-tauri/binaries/ffmpeg
            cp "$(which ffprobe)" src-tauri/binaries/ffprobe
            chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
          else
            mkdir -p src-tauri/binaries
            curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ
            cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg src-tauri/binaries/
            cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe src-tauri/binaries/
            chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
          fi

      - name: Build application (Release)
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Verify build artifacts
        run: |
          echo "Checking for build artifacts..."

          if [ "${{ matrix.platform }}" = "windows" ]; then
            MSI_COUNT=$(find src-tauri/target/release/bundle/msi -name "*.msi" | wc -l)
            NSIS_COUNT=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | wc -l)

            if [ $MSI_COUNT -eq 0 ]; then
              echo "MSI installer not found"
              exit 1
            fi

            if [ $NSIS_COUNT -eq 0 ]; then
              echo "NSIS installer not found"
              exit 1
            fi

            echo "✅ Found $MSI_COUNT MSI installers and $NSIS_COUNT NSIS installers"
          else
            APP_COUNT=$(find src-tauri/target/release/bundle/macos -name "*.app" | wc -l)
            DMG_COUNT=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | wc -l)

            if [ $APP_COUNT -eq 0 ]; then
              echo "App bundle not found"
              exit 1
            fi

            if [ $DMG_COUNT -eq 0 ]; then
              echo "DMG installer not found"
              exit 1
            fi

            echo "✅ Found $APP_COUNT app bundles and $DMG_COUNT DMG installers"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_pattern }}
          retention-days: 7

  # Performance benchmarks
  performance-test:
    name: Performance Benchmarks
    runs-on: windows-latest
    needs: [build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: installers-windows-${{ github.sha }}
          path: ./artifacts

      - name: Run benchmarks
        run: |
          cd src-tauri
          cargo bench

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: src-tauri/target/criterion/
          retention-days: 30

  # All checks passed
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        backend-test,
        frontend-test,
        e2e-test-windows,
        e2e-test-macos,
        security-audit,
        build-check,
      ]
    if: success()

    steps:
      - name: All checks passed
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "Ready for deployment or release."
          echo "Platforms tested: Windows, macOS, Ubuntu"
          echo "Test coverage: Unit, Integration, E2E, Security"
