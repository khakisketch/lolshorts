name: Legacy Cross-Platform Release (Disabled)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Create GitHub Release
  create-release:
    if: ${{ false }} # Superseded by the approved production release workflow.
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.check_prerelease.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version and check prerelease
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease (contains alpha, beta, rc)
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check prerelease
        id: check_prerelease
        run: |
          echo "prerelease=${{ steps.get_version.outputs.prerelease }}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "## 🎮 What's New" > release_notes.md
            echo "" >> release_notes.md

            # Get commits since last tag
            echo "### 📝 Changes since $PREV_TAG" >> release_notes.md
            echo "" >> release_notes.md

            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD | head -20 >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "### 📦 Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Windows Installer (MSI)**: Recommended for most Windows users" >> release_notes.md
          echo "- **Windows Installer (NSIS)**: Alternative Windows installer" >> release_notes.md
          echo "- **macOS DMG**: For macOS users" >> release_notes.md
          echo "- **Source Code**: For developers" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 📝 Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Windows:" >> release_notes.md
          echo "1. Download the MSI or NSIS installer" >> release_notes.md
          echo "2. Run the installer" >> release_notes.md
          echo "3. Follow the installation wizard" >> release_notes.md
          echo "4. Launch LoLShorts from the Start Menu" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### macOS:" >> release_notes.md
          echo "1. Download the DMG file" >> release_notes.md
          echo "2. Open the DMG file" >> release_notes.md
          echo "3. Drag LoLShorts to Applications folder" >> release_notes.md
          echo "4. Launch from Applications" >> release_notes.md
          echo "" >> release_notes.md

          echo "### ⚠️ System Requirements" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Windows**: Windows 10+ (64-bit)" >> release_notes.md
          echo "- **macOS**: macOS 10.15+ (64-bit)" >> release_notes.md
          echo "- **Memory**: 8GB RAM recommended" >> release_notes.md
          echo "- **Storage**: 500MB free space" >> release_notes.md
          echo "- **League of Legends**: Must be installed" >> release_notes.md
          echo "- **FFmpeg**: Bundled (no separate installation needed)" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 🔒 Legal" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [Terms of Service](https://github.com/LoLShorts/lolshorts/blob/main/TERMS_OF_SERVICE.md)" >> release_notes.md
          echo "- [Privacy Policy](https://github.com/LoLShorts/lolshorts/blob/main/PRIVACY_POLICY.md)" >> release_notes.md
          echo "- [Riot Compliance](https://github.com/LoLShorts/lolshorts/blob/main/RIOT_COMPLIANCE.md)" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 📞 Support" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [Documentation](https://docs.lolshorts.com)" >> release_notes.md
          echo "- [Discord Community](https://discord.gg/lolshorts)" >> release_notes.md
          echo "- [Report Issues](https://github.com/LoLShorts/lolshorts/issues)" >> release_notes.md
          echo "" >> release_notes.md

          echo "---" >> release_notes.md
          echo "**Full Changelog**: https://github.com/LoLShorts/lolshorts/compare/$PREV_TAG...v$VERSION" >> release_notes.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: LoLShorts ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.get_version.outputs.prerelease }}

  # Build and upload Windows installers
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Prepare FFmpeg binaries
        run: |
          cd src-tauri/build_scripts
          .\prepare_ffmpeg.ps1 -Source Download

      - name: Build application (Release)
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Code signing setup (Windows)
        if: secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        run: |
          # Decode certificate from secret
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          $certPath = "$env:TEMP\certificate.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          # Import certificate
          $password = "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          Import-PfxCertificate -FilePath $certPath -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) -CertStoreLocation Cert:\CurrentUser\My

      - name: Sign Windows binaries
        if: secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        run: |
          # Sign the MSI and NSIS installers
          $msiPath = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          $nsisPath = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1

          if ($msiPath) {
            signtool sign /f "Cert:\CurrentUser\My\${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}" /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" /tr https://timestamp.digicert.com /td sha256 /fd sha256 $msiPath.FullName
          }

          if ($nsisPath) {
            signtool sign /f "Cert:\CurrentUser\My\${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}" /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" /tr https://timestamp.digicert.com /td sha256 /fd sha256 $nsisPath.FullName
          }

      - name: Get installer paths
        id: get_paths
        run: |
          $msiPath = (Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1).FullName
          $nsisPath = (Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1).FullName

          Write-Output "msi_path=$msiPath" >> $env:GITHUB_OUTPUT
          Write-Output "nsis_path=$nsisPath" >> $env:GITHUB_OUTPUT

          $msiName = Split-Path $msiPath -Leaf
          $nsisName = Split-Path $nsisPath -Leaf

          Write-Output "msi_name=$msiName" >> $env:GITHUB_OUTPUT
          Write-Output "nsis_name=$nsisName" >> $env:GITHUB_OUTPUT

      - name: Upload MSI installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.get_paths.outputs.msi_path }}
          asset_name: ${{ steps.get_paths.outputs.msi_name }}
          asset_content_type: application/x-msi

      - name: Upload NSIS installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.get_paths.outputs.nsis_path }}
          asset_name: ${{ steps.get_paths.outputs.nsi_name }}
          asset_content_type: application/x-msdownload

  # Build and upload macOS installers
  build-macos:
    name: Build macOS Installers
    runs-on: macos-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install macOS dependencies
        run: |
          brew install create-dmg ffmpeg
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)" src-tauri/binaries/ffmpeg
          cp "$(which ffprobe)" src-tauri/binaries/ffprobe
          chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe

      - name: Install dependencies
        run: npm ci

      - name: Configure Tauri for macOS
        run: |
          # Update tauri.conf.json for macOS
          sed -i '' 's/"targets": \["nsis", "msi"\]/"targets": ["dmg", "app"]/' src-tauri/tauri.conf.json

      - name: Build application (Release)
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Code signing setup (macOS)
        if: secrets.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          # Create keychain
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain

          # Import certificate
          echo "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

          # Set keychain settings
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain

      - name: Sign macOS app
        if: secrets.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          # Find the app bundle
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)

          if [ -n "$APP_PATH" ]; then
            echo "Signing app at: $APP_PATH"
            codesign --force --deep --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$APP_PATH"

            # Verify signature
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

      - name: Create DMG
        run: |
          # Find the app bundle
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)

          if [ -n "$APP_PATH" ]; then
            # Create DMG using create-dmg
            create-dmg \
              --volname "LoLShorts" \
              --volicon "src-tauri/icons/icon.icns" \
              --window-pos 200 120 \
              --window-size 600 300 \
              --icon-size 100 \
              --icon "$APP_NAME.app" 175 120 \
              --hide-extension "$APP_NAME.app" \
              --app-drop-link 425 120 \
              "src-tauri/target/release/bundle/dmg/LoLShorts.dmg" \
              "$APP_PATH"
          fi

      - name: Sign DMG
        if: secrets.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)

          if [ -n "$DMG_PATH" ]; then
            echo "Signing DMG at: $DMG_PATH"
            codesign --force --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$DMG_PATH"

            # Verify signature
            codesign --verify --verbose "$DMG_PATH"
          fi

      - name: Get installer paths
        id: get_paths
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)

          if [ -n "$APP_PATH" ]; then
            echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
            echo "app_name=$(basename $APP_PATH)" >> $GITHUB_OUTPUT
          fi

          if [ -n "$DMG_PATH" ]; then
            echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
            echo "dmg_name=$(basename $DMG_PATH)" >> $GITHUB_OUTPUT
          fi

      - name: Upload DMG installer
        if: steps.get_paths.outputs.dmg_path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.get_paths.outputs.dmg_path }}
          asset_name: ${{ steps.get_paths.outputs.dmg_name }}
          asset_content_type: application/octet-stream

  # Generate checksums
  generate-checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [create-release, build-windows, build-macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Create directory for assets
            if (!fs.existsSync('./assets')) {
              fs.mkdirSync('./assets');
            }

      - name: Generate checksums file
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          echo "Generating checksums for LoLShorts $VERSION"

          cat > checksums.txt << EOF
          SHA256 Checksums for LoLShorts $VERSION

          Release Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          This file contains SHA256 checksums for all official LoLShorts release assets.
          Verify your downloads using: sha256sum -c checksums.txt

          EOF

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain

  # Update Tauri auto-updater manifest
  update-manifest:
    name: Update Auto-Updater Manifest
    runs-on: ubuntu-latest
    needs: [create-release, build-windows, build-macos]

    steps:
      - name: Generate updater manifest
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          IS_PRERELEASE="${{ needs.create-release.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            MANIFEST_FILE="updates-prerelease.json"
          else
            MANIFEST_FILE="updates.json"
          fi

          # Create JSON manifest
          cat > $MANIFEST_FILE << EOF
          {
            "version": "$VERSION",
            "notes": "See release notes at https://github.com/LoLShorts/lolshorts/releases/tag/v$VERSION",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/LoLShorts/lolshorts/releases/download/v$VERSION/LoLShorts_${VERSION}_x64-setup.exe"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/LoLShorts/lolshorts/releases/download/v$VERSION/LoLShorts_${VERSION}_x64.dmg"
              }
            }
          }
          EOF

          echo "Generated updater manifest:"
          cat $MANIFEST_FILE

      - name: Deploy updater manifest
        # This would typically upload to your update server
        # For now, create as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: "*.json"

  # Post-release validation
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: [create-release, build-windows, build-macos]

    steps:
      - name: Validate release completeness
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          echo "Validating LoLShorts $VERSION release..."

          # Check if release exists and has assets
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$VERSION" \
            > release.json

          ASSET_COUNT=$(jq -r '.assets | length' release.json)

          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "❌ Release has insufficient assets ($ASSET_COUNT found)"
            exit 1
          fi

          echo "✅ Release validation complete - $ASSET_COUNT assets found"

  # Notification
  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-windows, build-macos, validate-release]
    if: success()

    steps:
      - name: Release completed
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          IS_PRERELEASE="${{ needs.create-release.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "🚀 Pre-release $VERSION completed successfully!"
          else
            echo "🎉 Release $VERSION completed successfully!"
          fi

          echo "Download: https://github.com/LoLShorts/lolshorts/releases/tag/v$VERSION"

      - name: Send Discord notification (optional)
        if: secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          IS_PRERELEASE="${{ needs.create-release.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            COLOR=15105570  # Orange for prerelease
            TITLE="🚀 Pre-release LoLShorts $VERSION"
          else
            COLOR=5763719   # Green for stable release
            TITLE="🎉 LoLShorts $VERSION Released"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" << EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "description": "A new version of LoLShorts is now available for download!",
              "url": "https://github.com/LoLShorts/lolshorts/releases/tag/v$VERSION",
              "color": $COLOR,
              "fields": [
                {
                  "name": "Downloads",
                  "value": "[Windows Installer](https://github.com/LoLShorts/lolshorts/releases/download/v$VERSION/) • [macOS DMG](https://github.com/LoLShorts/lolshorts/releases/download/v$VERSION/)",
                  "inline": false
                },
                {
                  "name": "Full Changelog",
                  "value": "[View Changes](https://github.com/LoLShorts/lolshorts/releases/tag/v$VERSION)",
                  "inline": false
                }
              ]
            }]
          }
          EOF
