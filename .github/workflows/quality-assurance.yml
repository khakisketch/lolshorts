name: Legacy Extended QA (Manual)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Run Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run cargo-deny (dependency audit)
        uses: EmbarkStudios/cargo-deny-action@ef301417264190a1eb9f26fcf171642070085c5b # v1

  # Performance benchmarks
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Run backend benchmarks
        run: |
          cd src-tauri
          cargo bench

      - name: Process benchmark results
        run: |
          cd src-tauri/target/criterion
          # Generate summary report
          find . -name "report" -type d | head -10 | while read dir; do
            echo "Benchmark results for $dir:"
            if [ -f "$dir/index.html" ]; then
              echo "✅ Report available"
            fi
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: src-tauri/target/criterion/
          retention-days: 30

      - name: Performance regression check
        run: |
          # Simple performance regression check
          # This would be enhanced with actual baseline comparison
          echo "📊 Performance regression checks"
          echo "• Check benchmark results against previous runs"
          echo "• Alert on significant performance degradation"

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Install dependencies
        run: npm ci

      - name: Build application (debug)
        run: npm run tauri build -- --debug

      - name: Run integration tests
        run: |
          cd src-tauri
          cargo test --test integration -- --nocapture

      - name: Document recording backend manual QA gap
        run: |
          echo "::warning::Recording backend field QA still requires a live League Client session; automated coverage is provided by Rust unit and integration tests."

      - name: Document YouTube integration manual QA gap
        run: |
          echo "::warning::YouTube OAuth/upload field QA requires configured credentials and a test account; this workflow does not perform a real upload."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results-${{ matrix.platform }}
          path: |
            src-tauri/target/debug/deps/
            test-results/
          retention-days: 30

  # End-to-end tests with real application
  e2e-comprehensive:
    name: Comprehensive E2E Tests
    runs-on: windows-latest
    needs: [code-quality, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"
          cache: "npm"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application (debug)
        run: npm run tauri build -- --debug

      - name: Run comprehensive E2E tests
        run: npx playwright test --project=chromium

      - name: Run accessibility tests
        run: |
          # Install accessibility testing tools
          npm install -g axe-cli

          # Run accessibility tests
          npx playwright test --config=playwright.config.ts tests/accessibility/

      - name: Performance tests with Lighthouse
        run: |
          # Install Lighthouse CI
          npm install -g @lhci/cli@0.12.x

          # Run Lighthouse tests
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-comprehensive-results
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          retention-days: 30

  # Security scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Run Rust security audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock

      - name: Run cargo-deny security check
        uses: EmbarkStudios/cargo-deny-action@ef301417264190a1eb9f26fcf171642070085c5b # v1
        with:
          command: check

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: "javascript, typescript"

      - name: Autobuild
        uses: github/codeql-action/autobuild@5ba2889ada762081db2c4f32a729827dce632c7b # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

      - name: Semgrep security scan
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/rust

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.2.0"

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js licenses
        run: |
          npm install -g license-checker
          license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD'

      - name: Check Rust licenses
        run: |
          cargo install cargo-license
          cd src-tauri
          cargo license --only MIT Apache-2.0 BSD-2-Clause BSD-3-Clause ISC 0BSD

      - name: Generate license report
        run: |
          echo "# LoLShorts License Report" > LICENSE_REPORT.md
          echo "" >> LICENSE_REPORT.md
          echo "## Node.js Dependencies" >> LICENSE_REPORT.md
          license-checker --csv > nodejs_licenses.csv
          cat nodejs_licenses.csv >> LICENSE_REPORT.md
          echo "" >> LICENSE_REPORT.md
          echo "## Rust Dependencies" >> LICENSE_REPORT.md
          cd src-tauri
          cargo license --csv > ../rust_licenses.csv
          cd ..
          cat rust_licenses.csv >> LICENSE_REPORT.md

      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-report
          path: |
            LICENSE_REPORT.md
            nodejs_licenses.csv
            rust_licenses.csv
          retention-days: 30

  # Quality metrics and reporting
  quality-report:
    name: Quality Metrics Report
    runs-on: ubuntu-latest
    needs:
      [
        code-quality,
        performance-benchmarks,
        integration-tests,
        security-scan,
        license-check,
      ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Generate quality report
        run: |
          # Create comprehensive quality report
          cat > QUALITY_REPORT.md << EOF
          # LoLShorts Quality Report

          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Code Quality Status

          ### Rust Code
          - Formatting: ${{ needs.code-quality.result }}
          - Clippy: ${{ needs.code-quality.result }}
          - Dependencies: ${{ needs.code-quality.result }}

          ### TypeScript Code
          - ESLint: ${{ needs.code-quality.result }}
          - TypeScript Check: ${{ needs.code-quality.result }}
          - Prettier: ${{ needs.code-quality.result }}

          ## Test Results

          - Unit Tests: ${{ needs.integration-tests.result }}
          - Integration Tests: ${{ needs.integration-tests.result }}
          - E2E Tests: ${{ needs.e2e-comprehensive.result }}

          ## Security Status

          - Rust Security Audit: ${{ needs.security-scan.result }}
          - npm Audit: ${{ needs.security-scan.result }}
          - CodeQL Analysis: ${{ needs.security-scan.result }}
          - Semgrep Analysis: ${{ needs.security-scan.result }}

          ## License Compliance

          - License Check: ${{ needs.license-check.result }}

          ## Performance Benchmarks

          - Benchmarks: ${{ needs.performance-benchmarks.result }}
          EOF

          echo "Quality report generated"
          cat QUALITY_REPORT.md

      - name: Comment on PR with quality report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('QUALITY_REPORT.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Quality Report\n\n${report}`
            });

      - name: Upload quality report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report
          path: QUALITY_REPORT.md
          retention-days: 30

  # All checks passed notification
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, integration-tests, security-scan]
    if: always()

    steps:
      - name: Quality gate check
        run: |
          QUALITY_RESULTS=(
            "${{ needs.code-quality.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.security-scan.result }}"
          )

          FAILED_CHECKS=0

          for result in "${QUALITY_RESULTS[@]}"; do
            if [ "$result" != "success" ]; then
              ((FAILED_CHECKS++))
            fi
          done

          if [ $FAILED_CHECKS -eq 0 ]; then
            echo "✅ All quality checks passed"
            echo "🚀 Ready for deployment"
          else
            echo "❌ $FAILED_CHECKS quality checks failed"
            echo "🚫 Deployment blocked"
            exit 1
          fi
