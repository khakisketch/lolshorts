name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release
        required: true
        type: string
      confirmation:
        description: Type RELEASE after reviewing readiness and field evidence
        required: true
        type: string
      channel:
        description: Release channel matching the package version suffix
        required: true
        type: choice
        options:
          - beta
          - rc
          - stable

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  supabase-release-gate:
    name: Supabase migration and security gate
    if: ${{ inputs.confirmation == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0

      - name: Rebuild migrations and run pgTAP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-logs
          supabase start 2>&1 | tee release-logs/supabase-start.log
          supabase db reset 2>&1 | tee release-logs/supabase-db-reset.log
          supabase test db 2>&1 | tee release-logs/supabase-db-tests.log

      - name: Stop isolated Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup 2>&1 | tee release-logs/supabase-stop.log

      - name: Upload Supabase release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-supabase-${{ github.sha }}
          path: release-logs/
          if-no-files-found: ignore
          retention-days: 14

  release-windows:
    name: Approved signed Windows release
    if: ${{ inputs.confirmation == 'RELEASE' }}
    needs: supabase-release-gate
    runs-on: windows-latest
    timeout-minutes: 120
    environment: production-release
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      # Optional: omit these secrets to ship without remote crash reporting.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.2.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.3

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Validate requested version and release secrets
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne '${{ inputs.version }}') {
            throw "Requested version ${{ inputs.version }} does not match package version $($package.version)"
          }
          $version = '${{ inputs.version }}'
          $channel = '${{ inputs.channel }}'
          $patterns = @{
            beta = '^\d+\.\d+\.\d+-beta\.\d+$'
            rc = '^\d+\.\d+\.\d+-rc\.\d+$'
            stable = '^\d+\.\d+\.\d+$'
          }
          if ($version -notmatch $patterns[$channel]) {
            throw "Version $version does not match release channel $channel"
          }
          foreach ($name in @(
            'VITE_SUPABASE_URL','VITE_SUPABASE_ANON_KEY','SUPABASE_URL','SUPABASE_ANON_KEY',
            'YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REDIRECT_URI',
            'TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD','TAURI_UPDATER_PUBKEY',
            'WINDOWS_CERTIFICATE','WINDOWS_CERTIFICATE_PASSWORD'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required production secret: $name" }
          }
          if ($env:SUPABASE_URL -ne $env:VITE_SUPABASE_URL -or $env:SUPABASE_ANON_KEY -ne $env:VITE_SUPABASE_ANON_KEY) {
            throw 'Rust and Vite Supabase public configuration must match'
          }
          if ($env:SUPABASE_URL -notmatch '^https://[^/\s]+(?:/.*)?$') {
            throw 'SUPABASE_URL must use HTTPS in a production artifact'
          }
          if ($env:SUPABASE_ANON_KEY -match '(?i)service[_-]?role|sb_secret_|your-anon-key') {
            throw 'SUPABASE_ANON_KEY must be a public anon/publishable key, never a service-role or secret key'
          }
          if ($env:YOUTUBE_CLIENT_ID -notmatch '\.apps\.googleusercontent\.com$') {
            throw 'YOUTUBE_CLIENT_ID must be a Google desktop OAuth client id'
          }
          if ($env:YOUTUBE_REDIRECT_URI -notmatch '^http://(localhost|127\.0\.0\.1):[1-9]\d{0,4}/[^?#/]+(?:/[^?#]*)?$') {
            throw 'YOUTUBE_REDIRECT_URI must use an HTTP loopback address with an explicit port and callback path'
          }
          $redirectUri = [Uri]$env:YOUTUBE_REDIRECT_URI
          if ($redirectUri.Port -gt 65535 -or $redirectUri.Query -or $redirectUri.Fragment) {
            throw 'YOUTUBE_REDIRECT_URI must use a valid port and may not contain a query or fragment'
          }

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox msedge

      - name: Prepare FFmpeg sidecars
        shell: powershell
        run: ./src-tauri/build_scripts/prepare_ffmpeg.ps1 -Source Download

      - name: Run complete release gate
        shell: powershell
        run: ./scripts/verify-non-game-readiness.ps1

      - name: Import Authenticode certificate
        id: cert
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'lolshorts-release.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert.Thumbprint) { throw 'Authenticode certificate import failed' }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build signed production installers
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $channel = '${{ inputs.channel }}'
          $endpoint = if ($channel -eq 'stable') {
            'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
          } else {
            'https://github.com/${{ github.repository }}/releases/download/updater-preview/latest.json'
          }
          @{
            bundle = @{ windows = @{ certificateThumbprint = '${{ steps.cert.outputs.thumbprint }}' } }
            plugins = @{ updater = @{ endpoints = @($endpoint) } }
          } | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath release-signing-config.json -Encoding utf8
          npx tauri build --bundles msi,nsis --config release-signing-config.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate signed installers and sidecars fail-closed
        shell: powershell
        run: |
          ./scripts/verify-release-contract.ps1 -BundleDir src-tauri/target/release/bundle
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          ./tests/installer/validate-installer.ps1 -InstallerPath $msi.FullName -InstallerType MSI -NonInteractive -RunSilentInstall -ReleaseChannel
          ./tests/installer/validate-installer.ps1 -InstallerPath $nsis.FullName -InstallerType NSIS -NonInteractive -RunSilentInstall -ReleaseChannel

      - name: Generate signed updater manifest
        shell: powershell
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $signaturePath = "$($nsis.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Missing updater signature: $signaturePath" }
          $artifactUrl = if ('${{ inputs.channel }}' -eq 'stable') {
            "https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/$($nsis.Name)"
          } else {
            "https://github.com/${{ github.repository }}/releases/download/updater-preview/$($nsis.Name)"
          }
          $manifest = @{
            version = '${{ inputs.version }}'
            notes = 'See the GitHub release notes for this version.'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
                url = $artifactUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath latest.json -Encoding utf8

      - name: Create approved draft release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: LoLShorts ${{ inputs.version }}
          draft: ${{ inputs.channel == 'stable' }}
          prerelease: ${{ inputs.channel != 'stable' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json

      - name: Publish beta/RC updater preview feed
        if: ${{ inputs.channel != 'stable' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: updater-preview
          name: LoLShorts updater preview feed
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
